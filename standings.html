<section class="card">

```
<h2>🏆 Championship Standings</h2>

<!-- SEASON SELECTOR -->

<div class="race-selector">

    <label for="seasonSelect">
        Select Season:
    </label>

    <select id="seasonSelect" onchange="showStandings()">

        <option value="season2">
            Season 2 — 2026
        </option>

        <option value="season1">
            Season 1
        </option>

    </select>

</div>


<!-- CURRENT SEASON TITLE -->

<h2 id="seasonTitle" class="race-title">
    Season 2
</h2>

<p id="seasonInfo" class="race-info">
    2026 Championship
</p>


<!-- STANDINGS TABLE -->

<table>

    <thead>

        <tr>
            <th>Pos</th>
            <th>Driver</th>
            <th>Team</th>
            <th>Points</th>
        </tr>

    </thead>

    <tbody id="standingsTable">
    </tbody>

</table>
```

</section>

</footer>

<script>

const seasonStandings = {

    /* =========================
       SEASON 2
       ========================= */

    season2: {

        title: "Season 2",
        info: "2026 Championship",

        drivers: [

            ["1", "Driver_One", "Red Bull", "25"],

            ["2", "Driver_Two", "Ferrari", "18"],

            ["3", "Driver_Three", "Mercedes", "15"],

            ["4", "Driver_Four", "McLaren", "12"],

            ["5", "Driver_Five", "Aston Martin", "10"],

            ["6", "Driver_Six", "Williams", "8"],

            ["7", "Driver_Seven", "Alpine", "6"],

            ["8", "Driver_Eight", "Haas", "4"]

        ]

    },


    /* =========================
       SEASON 1
       ========================= */

    season1: {

        title: "Season 1",
        info: "SRL Season 1 Championship",

        drivers: [

            ["1", "Driver_One", "Red Bull", "150"],

            ["2", "Driver_Two", "Ferrari", "132"],

            ["3", "Driver_Three", "McLaren", "118"],

            ["4", "Driver_Four", "Mercedes", "105"],

            ["5", "Driver_Five", "Aston Martin", "94"],

            ["6", "Driver_Six", "Williams", "82"],

            ["7", "Driver_Seven", "Alpine", "71"],

            ["8", "Driver_Eight", "Haas", "60"]

        ]

    }

};


/* =========================
   DISPLAY STANDINGS
   ========================= */

function showStandings() {

    const selectedSeason =
        document.getElementById("seasonSelect").value;

    const season =
        seasonStandings[selectedSeason];


    /* Change title */

    document.getElementById("seasonTitle").textContent =
        season.title;


    /* Change subtitle */

    document.getElementById("seasonInfo").textContent =
        season.info;


    /* Get table */

    const table =
        document.getElementById("standingsTable");


    /* Clear old standings */

    table.innerHTML = "";


    /* Add drivers */

    season.drivers.forEach(driver => {

        const row =
            document.createElement("tr");


        row.innerHTML = `
            <td class="position">${driver[0]}</td>
            <td>${driver[1]}</td>
            <td class="status">${driver[2]}</td>
            <td class="points">${driver[3]}</td>
        `;


        table.appendChild(row);

    });

}


/* Load Season 2 automatically */

showStandings();

</script>

</body>
