<script>

/* =========================================
   EDIT RACE RESULTS HERE
   ========================================= */

const results = {

    season2: {

        round1: {

            name: "Bahrain GP",

            date: "13/09/2026",

            drivers: [

                ["1", "Driver One", "Red Bull", "25"],
                ["2", "Driver Two", "Ferrari", "18"],
                ["3", "Driver Three", "McLaren", "15"],
                ["4", "Driver Four", "Mercedes", "12"],
                ["5", "Driver Five", "Aston Martin", "10"]

            ]

        },


        round2: {

            name: "British GP",

            date: "20/09/2026",

            drivers: [

                ["1", "Driver Two", "Ferrari", "25"],
                ["2", "Driver One", "Red Bull", "18"],
                ["3", "Driver Five", "Aston Martin", "15"],
                ["4", "Driver Three", "McLaren", "12"],
                ["5", "Driver Four", "Mercedes", "10"]

            ]

        },


        round3: {

            name: "Belgian GP",

            date: "TBD",

            drivers: [

                ["1", "TBD", "TBD", "0"],
                ["2", "TBD", "TBD", "0"],
                ["3", "TBD", "TBD", "0"],
                ["4", "TBD", "TBD", "0"],
                ["5", "TBD", "TBD", "0"]

            ]

        }

    },


    season1: {

        round1: {

            name: "Bahrain GP",

            date: "01/06/2026",

            drivers: [

                ["1", "Driver One", "Red Bull", "25"],
                ["2", "Driver Two", "Ferrari", "18"],
                ["3", "Driver Three", "McLaren", "15"]

            ]

        },


        round2: {

            name: "Saudi Arabian GP",

            date: "08/06/2026",

            drivers: [

                ["1", "Driver Three", "McLaren", "25"],
                ["2", "Driver One", "Red Bull", "18"],
                ["3", "Driver Two", "Ferrari", "15"]

            ]

        }

    }

};


/* =========================================
   LOAD RACES INTO DROPDOWN
   ========================================= */

function loadRaces() {

    const season =
        document.getElementById("seasonSelect").value;

    const raceSelect =
        document.getElementById("raceSelect");

    raceSelect.innerHTML = "";

    const seasonResults =
        results[season];

    Object.keys(seasonResults).forEach(function(round) {

        const option =
            document.createElement("option");

        option.value = round;

        option.textContent =
            round.replace("round", "Round ")
            + " — "
            + seasonResults[round].name;

        raceSelect.appendChild(option);

    });

    showResults();

}


/* =========================================
   DISPLAY RESULTS
   ========================================= */

function showResults() {

    const season =
        document.getElementById("seasonSelect").value;

    const round =
        document.getElementById("raceSelect").value;

    const race =
        results[season][round];

    if (!race) {
        return;
    }

    document.getElementById("raceTitle").textContent =
        race.name;

    document.getElementById("raceInfo").textContent =
        season === "season2"
            ? "Season 2 • " + round.replace("round", "Round ")
            : "Season 1 • " + round.replace("round", "Round ");


    const table =
        document.getElementById("resultsTable");

    table.innerHTML = "";


    race.drivers.forEach(function(driver) {

        const row =
            document.createElement("tr");

        row.innerHTML = `
            <td class="position">${driver[0]}</td>
            <td>${driver[1]}</td>
            <td class="muted">${driver[2]}</td>
            <td class="points">${driver[3]}</td>
        `;

        table.appendChild(row);

    });

}


/* =========================================
   EVENT LISTENERS
   ========================================= */

document
    .getElementById("seasonSelect")
    .addEventListener("change", loadRaces);


document
    .getElementById("raceSelect")
    .addEventListener("change", showResults);


/* =========================================
   LOAD DEFAULT
   ========================================= */

loadRaces();

</script>

</body>
