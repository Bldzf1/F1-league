<section class="card">

```
<h2>📅 Race Calendar</h2>


<div class="selector">

    <label for="seasonSelect">
        Select Season
    </label>

    <select id="seasonSelect">

        <option value="season2">
            Season 2 — 2026
        </option>

        <option value="season1">
            Season 1
        </option>

    </select>

</div>


<h2 id="calendarTitle">
    Season 2
</h2>


<table>

    <thead>

        <tr>

            <th>Round</th>
            <th>Grand Prix</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>

        </tr>

    </thead>


    <tbody id="calendarTable"></tbody>

</table>
```

</section>

<footer>
    © 2026 Slipstream Racing League (SRL). All Rights Reserved.
</footer>

<script>

/* =========================================
   EDIT CALENDAR HERE
   ========================================= */

const calendars = {

    season2: [

        ["1", "Bahrain GP", "13/09/2026", "7:00 PM", "Completed"],

        ["2", "British GP", "20/09/2026", "7:00 PM", "Upcoming"],

        ["3", "Belgian GP", "TBD", "TBD", "TBD"],

        ["4", "Italian GP", "TBD", "TBD", "TBD"],

        ["5", "Japanese GP", "TBD", "TBD", "TBD"],

        ["6", "Abu Dhabi GP", "TBD", "TBD", "TBD"]

    ],


    season1: [

        ["1", "Bahrain GP", "01/06/2026", "7:00 PM", "Completed"],

        ["2", "Saudi Arabian GP", "08/06/2026", "7:00 PM", "Completed"],

        ["3", "Australian GP", "15/06/2026", "7:00 PM", "Completed"],

        ["4", "British GP", "22/06/2026", "7:00 PM", "Completed"]

    ]

};


/* =========================================
   DISPLAY CALENDAR
   ========================================= */

function showCalendar() {

    const selected =
        document.getElementById("seasonSelect").value;

    const races =
        calendars[selected];

    document.getElementById("calendarTitle").textContent =
        selected === "season2"
            ? "Season 2"
            : "Season 1";

    const table =
        document.getElementById("calendarTable");

    table.innerHTML = "";

    races.forEach(function(race) {

        const row =
            document.createElement("tr");

        let statusClass = "tbd";

        if (race[4] === "Completed") {
            statusClass = "completed";
        }

        if (race[4] === "Upcoming") {
            statusClass = "upcoming";
        }

        row.innerHTML = `
            <td><strong>${race[0]}</strong></td>
            <td>${race[1]}</td>
            <td>${race[2]}</td>
            <td>${race[3]}</td>
            <td class="${statusClass}">
                ${race[4]}
            </td>
        `;

        table.appendChild(row);

    });

}


document
    .getElementById("seasonSelect")
    .addEventListener("change", showCalendar);


showCalendar();

</script>

</body>
